<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - PicGram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fafafa] text-neutral-900 font-['Plus_Jakarta_Sans'] antialiased">

    <!-- Navigasi Atas -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-neutral-200">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tight">PicGram</a>
            <nav class="flex items-center space-x-6">
                <a href="index.html" class="text-neutral-500 text-lg transition hover:scale-110"><i class="fa-solid fa-house"></i></a>
                <a href="profile.html" class="text-neutral-900 text-lg transition hover:scale-110"><i class="fa-solid fa-user"></i></a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <!-- Bagian Profil Info -->
        <div class="flex flex-col md:flex-row items-center md:items-start gap-8 bg-white p-8 rounded-3xl border border-neutral-200 shadow-sm mb-10">
            <div class="w-24 h-24 bg-neutral-900 text-white rounded-full flex items-center justify-content text-3xl font-bold shadow-inner">
                <span id="userInitial" class="m-auto">U</span>
            </div>
            <div class="flex-1 text-center md:text-left">
                <h1 id="usernameDisplay" class="text-2xl font-bold mb-1">Pengguna PicGram</h1>
                <p id="userEmailDisplay" class="text-neutral-500 text-sm mb-4">email@example.com</p>
                
                <!-- Tombol Trigger Modal Upload -->
                <button onclick="openUploadModal()" class="bg-neutral-900 hover:bg-neutral-800 text-white px-6 py-2.5 rounded-full text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-plus mr-2"></i> Unggah Foto Baru
                </button>
            </div>
        </div>

        <!-- Galeri Foto Pengguna -->
        <h2 class="text-lg font-bold mb-4">Postingan Anda</h2>
        <div id="userPostsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Postingan pengguna dimuat di sini -->
        </div>
    </main>

    <!-- Modal Unggah Foto -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-xl border border-neutral-100 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Unggah Foto Baru</h3>
                <button onclick="closeUploadModal()" class="text-neutral-400 hover:text-neutral-900"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Pilih Gambar</label>
                    <input type="file" id="imageFile" accept="image/*" required class="w-full text-sm text-neutral-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-neutral-100 file:text-neutral-700 hover:file:bg-neutral-200 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Caption</label>
                    <textarea id="captionInput" rows="3" placeholder="Tuliskan cerita di balik foto ini..." class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-neutral-400 transition resize-none"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-neutral-900 hover:bg-neutral-800 text-white py-3 rounded-full text-sm font-semibold transition shadow-sm">
                    Bagikan Postingan
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
