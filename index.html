<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicGram - Berbagi Foto Estetik</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fafafa] text-neutral-900 font-['Plus_Jakarta_Sans'] antialiased">

    <!-- Navigasi Atas -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-neutral-200">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tight bg-gradient-to-r from-neutral-900 to-neutral-600 bg-clip-text text-transparent">PicGram</a>
            
            <!-- Kolom Pencarian -->
            <div class="hidden md:flex items-center bg-neutral-100 rounded-full px-4 py-2 w-72 border border-transparent focus-within:border-neutral-300 transition">
                <i class="fa-solid fa-magnifying-glass text-neutral-400 mr-2 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Cari foto atau pengguna..." class="bg-transparent text-sm w-full focus:outline-none">
            </div>

            <!-- Navigasi Ikon -->
            <nav class="flex items-center space-x-6">
                <a href="index.html" class="text-neutral-900 text-lg transition hover:scale-110"><i class="fa-solid fa-house"></i></a>
                <a href="profile.html" class="text-neutral-500 text-lg transition hover:scale-110"><i class="fa-solid fa-user"></i></a>
            </nav>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <!-- Feed Grid / Pinterest Style -->
        <div id="feedContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Postingan akan dimuat secara dinamis oleh JavaScript -->
            <div class="animate-pulse bg-neutral-200 h-80 rounded-2xl"></div>
            <div class="animate-pulse bg-neutral-200 h-80 rounded-2xl"></div>
            <div class="animate-pulse bg-neutral-200 h-80 rounded-2xl"></div>
        </div>
    </main>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
